listen: ":8080"
token: "coc2-dev-token"
api_token: "coc2-api-token"
db: "./data/coc2.db"
plugins: "./plugins"
tls_cert: ""
tls_key: ""
client_ca: ""
require_tls: false
write_wait: "10s"
pong_wait: "70s"
ping_period: "25s"
operator_uds: "./coc2.sock"
operator_listen: ""

# Runtime logs: empty log_file keeps stderr (a service manager captures it).
# When set, logs go to the file with size-based rotation.
log_file: ""
log_level: "info"        # debug|info|warn|error
log_max_size_mb: 100     # rotate above this size
log_max_backups: 5       # rotated files kept
log_max_age_days: 28     # rotated files older than this are removed
log_compress: false

# Audit retention for oplog / transfer_audit / task history.
# 0 (default) keeps everything forever — evidence is only deleted when the
# operator explicitly asks for it.
audit_retention_days: 0
