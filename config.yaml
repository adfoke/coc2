listen: ":8080"
token: "coc2-dev-token"
api_token: "coc2-api-token"
db: "./data/coc2.db"
plugins: "./plugins"
tls_cert: ""
tls_key: ""
client_ca: ""
require_tls: false
write_wait: "10s"
pong_wait: "70s"
ping_period: "25s"
operator_uds: "./coc2.sock"
operator_listen: ""

# Refuse to start while token is still the built-in development value above:
# it is public knowledge, so anyone who can reach the agent plane could talk
# to it. Replace token with `openssl rand -hex 32`, or set this to true for a
# throwaway local run only.
allow_dev_token: false

# Runtime logs: empty log_file keeps stderr (a service manager captures it).
# When set, logs go to the file with size-based rotation.
log_file: ""
log_level: "info"        # debug|info|warn|error
log_max_size_mb: 100     # rotate above this size
log_max_backups: 5       # rotated files kept
log_max_age_days: 28     # rotated files older than this are removed
log_compress: false

# Audit retention for oplog / transfer_audit / task history. Default 14 days
# (two weeks) when the key is absent. Set 0 to keep everything forever.
audit_retention_days: 14
